# Configuration for automatically generated release notes on GitHub Releases.
# Reference: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - wontfix
      - refactor
      - chore
      - docs
  categories:
    - title: "Added"
      labels:
        - feat
        - feature
        - enhancement
    - title: "Changed"
      labels:
        - perf
        - performance
        - changed
    - title: "Fixed"
      labels:
        - fix
        - bug
    - title: "Security"
      labels:
        - security
    - title: "Other"
      labels:
        - "*"
