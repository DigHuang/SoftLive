<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" role="img" aria-labelledby="title description">
  <title id="title">SoftLive · Sync Frost</title>
  <desc id="description">A cyan and blue S ribbon with a softly lit upper fold and a smoothly joined lower return.</desc>
  <defs>
    <path id="ribbon" d="M76.7 15C77.1 29 72.6 32.5 59 35.6L44 39C35 41 34 43.4 43 46.2L61 51C75 54.7 79 59.8 76.3 68.8C73 78.7 59 81 21.8 87C20.2 73.5 27.1 69.8 43 66.4L57 63.3C62 62.2 63.5 60.8 55.8 58.8L34 53.1C20.2 49.5 20.1 43 23.5 36.3C28.8 25.8 43.2 23.1 76.7 15Z" />
    <clipPath id="ribbon-clip">
      <use xlink:href="#ribbon" />
    </clipPath>
    <linearGradient id="ribbon-base" x1="31" y1="22" x2="66" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7DDE1" />
      <stop offset=".46" stop-color="#79B4C5" />
      <stop offset="1" stop-color="#6A96BE" />
    </linearGradient>
    <linearGradient id="upper-face" x1="33" y1="27" x2="64" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D0F7EF" />
      <stop offset=".38" stop-color="#A5E0DE" />
      <stop offset=".72" stop-color="#83C5CF" />
      <stop offset="1" stop-color="#6CAABD" />
    </linearGradient>
    <linearGradient id="middle-face" x1="26" y1="42" x2="75" y2="69" gradientUnits="userSpaceOnUse">
      <stop stop-color="#619EB6" />
      <stop offset=".22" stop-color="#79BBC9" />
      <stop offset=".57" stop-color="#9ACFD6" />
      <stop offset=".82" stop-color="#86BBD0" />
      <stop offset="1" stop-color="#6B97BC" />
    </linearGradient>
    <linearGradient id="lower-face" x1="27" y1="73" x2="65" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6798C1" />
      <stop offset=".29" stop-color="#80B6CF" />
      <stop offset=".56" stop-color="#9BC8D8" />
      <stop offset="1" stop-color="#79A8C5" />
    </linearGradient>
    <linearGradient id="ribbon-edge" x1="30" y1="23" x2="69" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1FFFB" stop-opacity=".38" />
      <stop offset=".45" stop-color="#D4F2F5" stop-opacity=".06" />
      <stop offset=".75" stop-color="#9AC8EB" stop-opacity=".08" />
      <stop offset="1" stop-color="#DCEFFF" stop-opacity=".24" />
    </linearGradient>
    <filter id="ribbon-shadow" x="-35%" y="-25%" width="170%" height="165%">
      <feDropShadow dx=".3" dy="1.8" stdDeviation="1.1" flood-color="#284C75" flood-opacity=".18" />
    </filter>
    <filter id="surface-join" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation=".32" />
    </filter>
  </defs>
  <g id="sync-ribbon" transform="translate(0 -1) scale(1.02)">
    <use xlink:href="#ribbon" fill="url(#ribbon-base)" filter="url(#ribbon-shadow)" />
    <g clip-path="url(#ribbon-clip)">
      <rect x="18" y="58" width="64" height="32" fill="url(#middle-face)" />
      <path d="M76.7 15C77.1 29 72.6 32.5 59 35.6L44 39C33 41.4 22.7 43.3 28.4 50.8C21.5 47.4 20.7 42.1 23.5 36.3C28.8 25.8 43.2 23.1 76.7 15Z" fill="url(#upper-face)" filter="url(#surface-join)" />
      <path d="M44 39C35 41 34 43.4 43 46.2L61 51C75 54.7 79 59.8 76.3 68.8C74.65 73.75 70.325 76.8 61.7625000 79.3625000C67.9275000 77.5175000 66.1043375 66.1054125 61.1043375 61.6054125C56 60.5 42 57.8 32 54.4C20 48.1 22 44 44 39Z" fill="url(#middle-face)" filter="url(#surface-join)" />
      <path d="M21.8 87C20.2 73.5 27.1 69.8 43 66.4L57 63.3C59.25 62.805 60.79125 62.24925 61.1043375 61.6054125C66.1043375 66.1054125 67.9275000 77.5175000 61.7625000 79.3625000C53.2 81.925 40.4 84 21.8 87Z" fill="url(#lower-face)" filter="url(#surface-join)" />
    </g>
    <use xlink:href="#ribbon" fill="none" stroke="url(#ribbon-edge)" stroke-width=".14" />
  </g>
</svg>